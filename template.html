<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>美股 / 世界经济温度计</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2d3d; --muted:#7a8aa0;
    --line:#e3e8ef; --blue:#2980b9; --red:#c0392b; --green:#27ae60; --amber:#e67e22;
    --shadow:0 1px 3px rgba(20,40,80,.08),0 6px 18px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif;
       -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px;}
  header.top{background:linear-gradient(135deg,#1f3a5f,#2c5a8a);color:#fff;border-radius:16px;
             padding:22px 22px;box-shadow:var(--shadow);margin-bottom:18px;}
  header.top h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
  header.top .sub{opacity:.85;font-size:13px}
  header.top .meta{margin-top:12px;font-size:12px;opacity:.9;display:flex;gap:16px;flex-wrap:wrap}
  header.top .meta b{font-weight:600}
  .clock{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px;
         background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
  .mclock-wrap{display:flex;flex-direction:column;align-items:center;flex:none}
  .mclock{width:88px;height:88px;display:block}
  .mc-cap{font-size:9px;opacity:.6;margin-top:2px}
  .clock .cbinfo{min-width:0}
  .ck-title{font-size:14px;font-weight:700}
  .ck-line{font-size:12px;margin-top:5px;opacity:.92}
  .ck-line b{color:#fff}
  .ck-line .conf{opacity:.62;font-size:11px;margin-left:8px}
  .ck-sig{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ck-sig span{font-size:10.5px;background:rgba(255,255,255,.12);border-radius:20px;padding:2px 8px}
  @media(max-width:560px){.clock{align-items:flex-start}}
  .group{margin:26px 0 8px;display:flex;align-items:center;gap:10px}
  .group h2{margin:0;font-size:17px;color:var(--ink)}
  .group .bar{height:3px;flex:1;background:linear-gradient(90deg,var(--blue),transparent);border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
        box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:300px}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ptitle{font-size:14.5px;font-weight:700;line-height:1.35}
  .psub{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
  .badges{text-align:right;white-space:nowrap}
  .cur{display:block;font-size:19px;font-weight:800;color:var(--ink)}
  .cur small{font-size:11px;font-weight:600;color:var(--muted)}
  .pct{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
  .p-hi{background:#fdecea;color:var(--red)}
  .p-mid{background:#fef3e2;color:var(--amber)}
  .p-lo{background:#e9f7ef;color:var(--green)}
  .chart{width:100%;height:260px;margin-top:8px}
  .note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;
        border-top:1px dashed var(--line);padding-top:8px}
  .note b{color:var(--ink)}
  .updated{font-size:10.5px;color:#aab4c4;margin-top:4px}
  .verdict{margin:10px 0;padding:12px;border-radius:10px;font-weight:700;font-size:15px;text-align:center;color:#fff}
  .fields{list-style:none;padding:0;margin:6px 0 0;font-size:12.5px}
  .fields li{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
  .fields .on{color:var(--red);font-weight:700}
  .fields .off{color:var(--green)}
  /* 顶部总览 */
  .summary{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
           padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ring{position:relative;width:132px;height:132px;border-radius:50%;
        background:conic-gradient(var(--col) calc(var(--pct)*1%), #e9eef5 0);}
  .ring .inner{position:absolute;inset:11px;background:var(--card);border-radius:50%;
        display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .gv{font-size:30px;font-weight:800;line-height:1;color:var(--ink)}
  .ring .gl{font-size:12px;font-weight:700;margin-top:3px}
  .gauge .cap{font-size:11px;color:var(--muted)}
  .sum-main{min-width:0}
  .sum-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sum-head b{font-size:15px}
  .sum-head .muted{font-size:11.5px;color:var(--muted)}
  .alerts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
        font-size:11.5px;padding:4px 9px;border-radius:20px;border:1px solid transparent;line-height:1.3}
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .chip.high{background:#fdecea;color:#a5281b;border-color:#f5c6c0}
  .chip.mid{background:#fef3e2;color:#a8641b;border-color:#f6d9b0}
  .chip:hover{filter:brightness(.97)}
  .comps{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .comp{flex:1;min-width:110px}
  .comp .cn{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .comp .cb{height:6px;border-radius:4px;background:#eef2f7;margin-top:4px;overflow:hidden}
  .comp .cb i{display:block;height:100%;border-radius:4px}
  @media (max-width:560px){ .summary{grid-template-columns:1fr;justify-items:center;text-align:center}
                            .sum-main{width:100%} .sum-head{justify-content:center} .alerts{justify-content:center} }
  footer{margin-top:34px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="t-title">美股 / 世界经济温度计</h1>
    <div class="sub" id="t-sub"></div>
    <div class="meta">
      <span>数据更新：<b id="t-updated">—</b></span>
      <span>最新行情日：<b id="t-latest">—</b></span>
      <span>数据源：<b id="t-src">FRED · Yahoo Finance</b></span>
    </div>
    <div id="clock"></div>
  </header>
  <div id="summary"></div>
  <div id="root"></div>
  <footer>
    数据源：FRED（美联储经济数据库）· Yahoo Finance（美股/全球 ETF 日线）· 估值含 FRED 自算巴菲特指标<br/>
    本看板仅作公开市场数据的可视化复现，<b>不构成任何投资建议</b>。每日自动更新。
  </footer>
</div>

<!--ECHARTS_HERE-->
<!--DATA_HERE-->

<script>
(function(){
  var DATA = window.DATA || {};
  var bands = DATA.bands || [];
  document.getElementById('t-title').textContent = (DATA.meta&&DATA.meta.title)||'美股 / 世界经济温度计';
  document.getElementById('t-sub').textContent  = (DATA.meta&&DATA.meta.subtitle)||'';
  document.getElementById('t-updated').textContent = DATA.updated||'—';
  document.getElementById('t-latest').textContent  = DATA.latest||'—';

  function renderClock(c){
    if(!c || !c.phase) return;
    var el=document.getElementById('clock'); if(!el) return;
    var g=Math.max(-1,Math.min(1,c.growth||0)), i=Math.max(-1,Math.min(1,c.inflation||0));
    var dx=(60+g*42).toFixed(1), dy=(60-i*42).toFixed(1);
    var svg='<svg class="mclock" viewBox="0 0 120 120">'+
      '<path d="M60,60 L60,10 A50,50 0 0 1 110,60 Z" fill="#c0392b" opacity="0.14"/>'+
      '<path d="M60,60 L10,60 A50,50 0 0 1 60,10 Z" fill="#e67e22" opacity="0.14"/>'+
      '<path d="M60,60 L60,110 A50,50 0 0 1 10,60 Z" fill="#2980b9" opacity="0.14"/>'+
      '<path d="M60,60 L110,60 A50,50 0 0 1 60,110 Z" fill="#27ae60" opacity="0.14"/>'+
      '<circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>'+
      '<line x1="10" y1="60" x2="110" y2="60" stroke="rgba(255,255,255,.22)"/>'+
      '<line x1="60" y1="10" x2="60" y2="110" stroke="rgba(255,255,255,.22)"/>'+
      '<text x="88" y="33" font-size="8" fill="#ffd9d2" text-anchor="middle">过热</text>'+
      '<text x="32" y="33" font-size="8" fill="#ffe1c2" text-anchor="middle">滞胀</text>'+
      '<text x="32" y="93" font-size="8" fill="#cfe3ff" text-anchor="middle">衰退</text>'+
      '<text x="88" y="93" font-size="8" fill="#c8f0d8" text-anchor="middle">复苏</text>'+
      '<circle cx="'+dx+'" cy="'+dy+'" r="5.5" fill="'+(c.color||'#fff')+'" stroke="#fff" stroke-width="1.5"/>'+
      '</svg>';
    var sig=(c.signals||[]).map(function(s){
      return '<span title="'+esc(s.detail||'')+'">'+esc(s.name)+' '+esc(s.arrow||'')+'</span>';
    }).join('');
    el.innerHTML='<div class="clock">'+
      '<div class="mclock-wrap">'+svg+'<div class="mc-cap">增长→　通胀↑</div></div>'+
      '<div class="cbinfo">'+
        '<div class="ck-title">🕐 美林时钟 · <b style="color:'+(c.color||'#fff')+'">'+esc(c.phase)+' '+esc(c.en||'')+'</b></div>'+
        '<div class="ck-line">'+esc(c.note||'')+'<span class="conf">置信度 '+Math.round((c.confidence||0)*100)+'%</span></div>'+
        '<div class="ck-sig">'+sig+'</div>'+
      '</div></div>';
  }

  renderClock(DATA.clock);

  function fmt(v,nd){
    if(v==null||isNaN(v)) return '—';
    nd=(nd==null)?2:nd;
    return Number(v).toLocaleString('en-US',{minimumFractionDigits:nd,maximumFractionDigits:nd});
  }
  function pctClass(p){ return p>=75?'p-hi':(p>=40?'p-mid':'p-lo'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  function renderSummary(s){
    if(!s) return;
    var el=document.getElementById('summary'); if(!el) return;
    var score=(s.score==null)?'—':s.score;
    var pct=(s.score==null)?0:Math.max(0,Math.min(100,s.score));
    var col=s.color||'#7f8c8d';
    var html='<div class="summary">';
    html+='<div class="gauge"><div class="ring" style="--pct:'+pct+';--col:'+col+'">'+
          '<div class="inner"><span class="gv">'+score+'</span><span class="gl" style="color:'+col+'">'+esc(s.label||'')+'</span></div></div>'+
          '<div class="cap">综合温度 0–100</div></div>';
    html+='<div class="sum-main"><div class="sum-head"><b>'+esc(s.headline||'')+'</b>'+
          '<span class="muted">（点标签可跳到对应指标）</span></div>';
    html+='<div class="alerts">';
    var al=s.alerts||[];
    if(al.length){
      al.forEach(function(a){
        html+='<a class="chip '+(a.level||'mid')+'" href="#p-'+esc(a.id)+'"><span class="dot" style="background:'+
              (a.level==='high'?'#c0392b':'#e67e22')+'"></span><b>'+esc(a.id)+'</b> '+esc(a.title)+'：'+esc(a.text)+'</a>';
      });
    } else {
      html+='<span class="muted" style="font-size:12px">各项均在阈值内 ✅</span>';
    }
    html+='</div><div class="comps">';
    (s.components||[]).forEach(function(c){
      var cc=c.score>=75?'#c0392b':(c.score>=40?'#e67e22':'#27ae60');
      html+='<div class="comp"><div class="cn"><span>'+esc(c.name)+'</span><b>'+c.score+'</b></div>'+
            '<div class="cb"><i style="width:'+c.score+'%;background:'+cc+'"></i></div></div>';
    });
    html+='</div></div></div>';
    el.innerHTML=html;
    el.querySelectorAll('a.chip').forEach(function(a){
      a.addEventListener('click',function(e){
        e.preventDefault();
        var t=document.querySelector(a.getAttribute('href'));
        if(t){ t.scrollIntoView({behavior:'smooth',block:'center'});
               t.style.transition='box-shadow .4s';
               t.style.boxShadow='0 0 0 3px '+(a.classList.contains('high')?'#f5c6c0':'#f6d9b0');
               setTimeout(function(){t.style.boxShadow='';},1200); }
      });
    });
  }

  var root=document.getElementById('root');
  renderSummary(DATA.summary);
  (DATA.groups||[]).forEach(function(g){
    var gh=document.createElement('div'); gh.className='group';
    gh.innerHTML='<h2>'+esc(g.name)+'</h2><div class="bar"></div>';
    root.appendChild(gh);
    var grid=document.createElement('div'); grid.className='grid'; root.appendChild(grid);
    (g.panels||[]).forEach(function(p){ grid.appendChild(renderCard(p)); });
  });

  function renderCard(p){
    var card=document.createElement('div'); card.className='card'; card.id='p-'+p.id;
    var head=document.createElement('div'); head.className='phead';
    head.innerHTML='<div class="ptitle">'+esc(p.id)+' · '+esc(p.title)+
                   '<span class="psub">'+esc(p.subtitle||'')+'</span></div>';
    var badges=document.createElement('div'); badges.className='badges';
    var b='';
    if(p.current!=null) b+='<span class="cur">'+(p.nowcast?'≈':'')+fmt(p.current,p.decimals)+' <small>'+(p.unit||'')+'</small></span>';
    if(p.pct!=null)     b+='<span class="pct '+pctClass(p.pct)+'">分位 '+p.pct+'%</span>';
    badges.innerHTML=b; head.appendChild(badges);
    card.appendChild(head);

    if(p.type==='status'){ renderStatus(p,card); }
    else { var div=document.createElement('div'); div.className='chart'; card.appendChild(div);
           setTimeout(function(){ drawChart(div,p); }, 0); }
    var note=document.createElement('div'); note.className='note'; note.innerHTML=esc(p.note||'');
    card.appendChild(note);
    if(p.updated){ var u=document.createElement('div'); u.className='updated';
                   u.textContent = p.nowcast
                     ? ('数据截至 '+p.updated+'（≈估算；官方 '+(p.nowcast.base||'')+'）')
                     : ('数据截至 '+p.updated);
                   card.appendChild(u); }
    return card;
  }

  function renderStatus(p,card){
    var v=document.createElement('div'); v.className='verdict';
    v.style.background=(p.verdict_color||'#888'); v.textContent=p.verdict||'—'; card.appendChild(v);
    if(p.fields&&p.fields.length){
      var ul=document.createElement('ul'); ul.className='fields';
      p.fields.forEach(function(f){
        var li=document.createElement('li');
        li.innerHTML='<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:'+(f.on?'#c0392b':'#27ae60')+'"></span>'+esc(f.name)+'</span>'+
                     '<span class="'+(f.on?'on':'off')+'">'+(f.on?'触发':'正常')+' · '+esc(f.detail||'')+'</span>';
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
  }

  function drawChart(div,p){
    if(typeof echarts==='undefined'){ div.textContent='ECharts 未加载'; return; }
    var chart=echarts.init(div,null,{renderer:'canvas'});
    var series=[];
    (p.series||[]).forEach(function(s){
      series.push({name:s.name,type:'line',showSymbol:false,smooth:false,lineStyle:{width:1.8},data:s.values});
    });
    if(p.refs&&p.refs.length&&series.length){
      series[0].markLine={silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#b0b8c4'},
        label:{formatter:function(o){return o.name;},color:'#7a8aa0',fontSize:10},
        data:p.refs.map(function(r){return {name:r.label,yAxis:r.value,lineStyle:{color:r.color||'#b0b8c4'}};})};
    }
    if(bands.length&&series.length){
      series[0].markArea={silent:true,itemStyle:{color:'rgba(192,57,43,.06)'},
        data:bands.map(function(b){return [{xAxis:b[0]},{xAxis:b[1]}];})};
    }
    chart.setOption({
      grid:{left:48,right:14,top:24,bottom:26},
      tooltip:{trigger:'axis',confine:true,valueFormatter:function(v){return fmt(v,p.decimals);}},
      legend:{show:(p.series||[]).length>1,top:0,right:6,textStyle:{fontSize:10},itemWidth:14,itemHeight:8},
      xAxis:{type:'category',data:p.dates,boundaryGap:false,
             axisLabel:{fontSize:9,color:'#9aa6b5',formatter:function(v){return v?v.slice(0,7):'';}},
             axisLine:{lineStyle:{color:'#dfe5ee'}}},
      yAxis:{type:'value',scale:true,axisLabel:{fontSize:9,color:'#9aa6b5'},
             splitLine:{lineStyle:{color:'#eef2f7'}}},
      series:series
    });
    window.addEventListener('resize',function(){chart.resize();});
  }
})();
</script>
</body>
</html>
