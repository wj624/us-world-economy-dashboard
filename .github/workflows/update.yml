name: 每日自动更新看板

on:
  # 美股 16:00 ET 收盘 ≈ 北京 04:00–05:00（夏令/冬令）。
  # 22:30 UTC = 北京次日 06:30，此时美股收盘数据已定稿，抓取最准。
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取数据并计算指标
        id: fetch
        env:
          TZ: Asia/Shanghai
          # 可选：在仓库 Settings → Secrets 里加 FRED_API_KEY 可走官方 API（更快、限流更宽）。
          # 不设也能跑：fetch_data.py 会自动走 fredgraph.csv 免 key 通道。
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASDAQ_API_KEY: ${{ secrets.NASDAQ_API_KEY }}
        run: python fetch_data.py
        timeout-minutes: 10

      - name: 构建单文件页面
        env:
          TZ: Asia/Shanghai
        run: python build.py

      - name: 生成 AI 可读摘要
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -f data.json ]; then
            python make_llm_summary.py
          else
            echo "data.json 缺失，跳过摘要生成"
          fi

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data.js 不入库（= data.json 副本，build.py 需要时现生成）
          git add index.html data.json version.txt cache/
          git add llms.txt snapshot.md latest.json
          if git diff --staged --quiet; then
            echo "内容未变化，跳过提交。"
          else
            git commit -m "chore: 自动更新 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi
